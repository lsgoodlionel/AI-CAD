# 图层约定配置 —— 中国施工图「图层名 / 块名 → 构件类型」映射
#
# 用途：为构件识别（core/model3d/element_recognizer.py，A-16）提供强先验。
#       CAD 图层命名往往直接编码了构件语义，比纯几何启发式更可靠。
#
# 参考来源：
#   - AIA CAD Layer Guidelines（S-/A-/M-/P-/E- 专业前缀 + 四段命名）
#   - ISO 13567 图层组织标准
#   - 国标《房屋建筑制图统一标准》GB/T 50001 及各设计院常见中文图层约定
#
# 匹配语义（由加载器 layer_conventions.py 实现，优先级从高到低）：
#   1. aliases   —— 精确别名（整串相等，大小写不敏感）
#   2. prefixes  —— 前缀匹配（图层名以此开头）
#   3. substrings—— 子串匹配（图层名 / 块名包含此片段）
#   4. patterns  —— 正则匹配（Python re，大小写不敏感）
#
# 可扩展性：用户可直接向任一列表追加别名 / 前缀 / 子串 / 正则，无需改代码。
# 原则：只覆盖常见约定，不臆造过细的行业内部私有命名。

version: "1.0"
description: "中国施工图图层/块命名 → 构件类型映射（column/wall/beam/slab/pipe/equipment/door/window/axis）"

# ── 构件类型映射 ─────────────────────────────────────────────
# kind 取值须与 element_recognizer 的构件体系一致。
conventions:
  # 结构柱：S-COLU（AIA）/ KZ 框架柱 / GZ 构造柱 / 中文「柱」
  - kind: column
    aliases: ["S-COLU", "S-COLS", "STRU-COLU", "结构柱", "框架柱", "KZ", "GZ", "COLUMN"]
    prefixes: ["S-COLU", "S-COL", "A-COLS", "结-柱", "结构-柱"]
    substrings: ["柱"]
    patterns: ['^(?:S|STR)[-_]?COL']

  # 结构梁：S-BEAM / KL 框架梁 / LL 连梁 / 中文「梁」
  - kind: beam
    aliases: ["S-BEAM", "STRU-BEAM", "结构梁", "框架梁", "KL", "LL", "BEAM"]
    prefixes: ["S-BEAM", "S-BEA", "结-梁", "结构-梁"]
    substrings: ["梁"]
    patterns: ['^(?:S|STR)[-_]?BEA']

  # 结构板 / 楼板 / 基础底板 / 筏板 / 承台：S-SLAB / 中文「板」「楼板」「筏板」「底板」「承台」
  #   注：底板/筏板/顶板/叠合板等中文名含「板」子串已可命中；此处补充承台（无「板」字）
  #       与筏板/底板/顶板的英文/拼音代号（FB/DB/CT/JC/RAFT），提升基础平面图覆盖。
  - kind: slab
    aliases: ["S-SLAB", "STRU-SLAB", "结构板", "楼板", "现浇板", "筏板", "底板", "基础底板",
              "承台", "顶板", "叠合板", "悬挑板", "屋面板", "SLAB", "FLOOR-SLAB", "RAFT"]
    prefixes: ["S-SLAB", "S-SLB", "S-FLOR", "S-RAFT", "S-FND", "结-板", "结构-板",
               "FB-", "DB-", "WB-", "TB-", "CT-", "JC-", "筏板-", "底板-", "承台-"]
    substrings: ["楼板", "现浇板", "筏板", "底板", "承台", "顶板", "叠合板", "悬挑板", "屋面板", "板"]
    patterns: ['^(?:S|STR)[-_]?SL', '^(?:S[-_]?)?(?:RAFT|FND)', '^(?:FB|DB|WB|TB|CT|JC)\d']

  # 墙：S-WALL 剪力墙 / A-WALL 建筑墙 / 地下室外墙 / 挡土墙 / 人防墙 / 中文「墙」
  #   注：含「墙」的中文名（外墙/内墙/挡土墙/人防墙/承重墙/女儿墙…）已可经子串「墙」命中；
  #       此处补充拼音/英文代号（DWQ 地下室外墙 / RFQ 人防墙 / DTQ 挡土墙）与精确别名。
  - kind: wall
    aliases: ["S-WALL", "A-WALL", "剪力墙", "建筑墙", "砌体墙", "填充墙", "地下室外墙", "挡土墙",
              "人防墙", "外墙", "内墙", "承重墙", "女儿墙", "幕墙", "栏板墙", "WALL", "Q",
              "DWQ", "RFQ", "DTQ"]
    prefixes: ["S-WALL", "A-WALL", "S-WAL", "A-WAL", "S-RETW", "建-墙", "结-墙", "墙-",
               "DWQ-", "RFQ-", "DTQ-", "外墙-", "挡土墙-"]
    substrings: ["剪力墙", "砌体", "填充墙", "地下室外墙", "挡土墙", "人防墙", "承重墙", "女儿墙",
                 "幕墙", "栏板墙", "外墙", "内墙", "墙"]
    patterns: ['^[AS][-_]?WAL', '^(?:DWQ|RFQ|DTQ)']

  # 门（洞口）：门 / DOOR / M- 门编号 / A-DOOR
  #   注：门窗多为「块（block）」命名，加载器优先用块名匹配。
  # **`M-` 前缀与裸 `M` 别名已移除**：与上面的 `C-` 是同一个碰撞的另一半 ——
  # AIA CAD Layer Guidelines 里 **M = Mechanical 学科代码**，
  # 实测把整个机电命名空间判成门：`M-PIPE`（管线自己的前缀，就写在
  # layer_class_map.yaml 里）、`M-EQPM`、`M-PIPE-SUPPLY` 全部 → door。
  # 而 door 在 `_KIND_ORDER` 里排在 pipe/equipment 之前，抢先命中。
  # 中国院的门编号是 **M + 数字**（M1、M0921、M-1521），由 `^M\d` 与 `^M-\d`
  # 两条 pattern 一起覆盖，信息不丢 —— 与上面窗的 `^C\d` / `^C-\d` 完全对称。
  - kind: door
    aliases: ["A-DOOR", "门", "DOOR"]
    prefixes: ["A-DOOR", "A-DOR", "门-", "MEN-", "DOOR-"]
    substrings: ["门"]
    patterns: ['^M\d', '^M-\d', 'DOOR']

  # 窗（洞口）：窗 / WINDOW / C+数字 窗编号 / A-GLAZ
  #
  # **`C-` 前缀已移除**：它撞上 AIA CAD Layer Guidelines 的
  # **C = Civil 学科代码**，实测把 `C-SHET-TTLB`（图框标题块）判成了窗，
  # 导致 window 命中数虚高到 49670。中国院的窗编号是 **C + 数字**
  # （C1、C-1），已由 `patterns: ^C\d` 与 `^C-\d` 覆盖，信息不丢。
  - kind: window
    aliases: ["A-GLAZ", "A-WIND", "窗", "WINDOW"]
    prefixes: ["A-GLAZ", "A-WIND", "窗-", "CHUANG-", "WIN-", "WINDOW-"]
    substrings: ["窗"]
    patterns: ['^C\d', '^C-\d', 'WIND']

  # 机电管线：暖通风管 / 给排水管 / 中文「管」；system 另由 systems 段判定
  - kind: pipe
    aliases: ["M-DUCT", "P-PIPE", "H-PIPE", "风管", "水管", "管线", "PIPE", "DUCT"]
    prefixes: ["M-DUCT", "P-PIPE", "P-DOMW", "P-SANR", "M-HVAC", "暖-", "水-", "风-"]
    substrings: ["风管", "水管", "管道", "管线", "管"]
    patterns: ['^[MPH][-_]?(?:PIPE|DUCT|HVAC)']

  # 机电设备：设备 / EQPM / 电箱 / 桥架末端设备等
  - kind: equipment
    aliases: ["M-EQPM", "E-EQPM", "P-EQPM", "设备", "机电设备", "EQUIPMENT", "EQPM"]
    prefixes: ["M-EQPM", "E-EQPM", "P-EQPM", "E-POWR", "E-LITE", "设备-", "电-"]
    substrings: ["设备", "配电箱", "桥架", "水泵", "风机", "空调机"]
    patterns: ['[-_]EQPM', '^E[-_]?(?:POWR|LITE)']

  # 轴网 / 轴线：AXIS / GRID / DOTE(AIA 定位) / 中文「轴线」「轴网」「定位」
  - kind: axis
    aliases: ["S-GRID", "A-GRID", "AXIS", "GRID", "DOTE", "轴线", "轴网", "定位轴线"]
    prefixes: ["S-GRID", "A-GRID", "M-GRID", "轴-", "轴线-", "AXIS-", "GRID-"]
    substrings: ["轴线", "轴网", "定位轴"]
    patterns: ['[-_]?(?:GRID|AXIS)$', '^DOTE']

# ── 机电系统判定（仅对 pipe / equipment 有意义）─────────────────
# 返回的 system 与 element_recognizer._SYSTEM_KEYWORDS 命名保持一致：
#   消防 / 给排水 / 电气 / 暖通
systems:
  - system: 消防
    substrings: ["消防", "喷淋", "消火栓", "FIRE", "SPKL"]
    prefixes: ["F-", "FP-", "FIRE-"]

  - system: 给排水
    substrings: ["给排水", "给水", "排水", "雨水", "污水", "废水", "中水", "DOMW", "SANR", "STRM"]
    prefixes: ["P-", "PD-", "给-", "排-", "水-"]

  - system: 电气
    substrings: ["电气", "桥架", "配电", "照明", "动力", "强电", "弱电", "POWR", "LITE"]
    prefixes: ["E-", "EL-", "电-"]

  - system: 暖通
    substrings: ["暖通", "风管", "空调", "通风", "采暖", "HVAC", "DUCT"]
    prefixes: ["M-", "H-", "暖-", "通-", "风-"]

# ── 非构件图层闸（图层画的不是建筑实体，任何构件都不该从它产出）──────
#
# 与 `conventions` 是**相反方向**的判据：那边答「这个图层属于哪个构件类别」，
# 这边答「这个图层根本不产出构件」。
#
# **为什么单开 `sheet` 组，而不并进标注（annotation）**：
#   - 标注**依附于某个构件** —— `S-BEAM-TEXT` 是梁的文字，语义上仍属于 beam，
#     所以它由 `is_annotation_layer` 配合 `classify_by_layer` 组合使用。
#   - 图框/标题块/会签栏**不依附任何构件**，画的是「纸」不是「楼」，
#     与建筑实体零关系。
#   - AIA CAD Layer Guidelines 本身也是分开的：`-ANNO/-IDEN/-DIMS` 是挂在
#     专业构件后的 minor group，而 `SHET`(sheet)/`TTLB`(title block) 自成一系。
#   - 实践后果：将来要「只隐藏标注、保留图框」或反之，两组必须能分别开关；
#     混进同一个正则里就再也分不开。
#
# **兜底**：`core/model3d/layer_conventions.py::_DEFAULT_GATE_VOCAB` 有一份同样的
# 词表。`load_conventions()` 在 yaml 缺失/损坏时降级为空，构件映射降级只是
# 「少认几个构件」，而**闸降级会反向放行假构件** —— 代价方向相反，
# 所以闸不能只活在 yaml 里。两份的一致性由 `test_兜底词表与yaml不漂移` 钉住。
non_component:
  # 图框 / 标题块 / 会签栏：GB/T 50001《房屋建筑制图统一标准》第 4 章通用制图用语，
  # 非某工程的命名习惯。AIA 次级码 SHET=sheet、TTLB/TBLK=title block。
  #
  # **不得使用裸 `C-` 前缀**：`C` 是 AIA 的 Civil 学科码（总图/道路/管网），
  # 上面窗的 `C-` 前缀正是因为把 `C-SHET-TTLB` 判成窗才被移除（见 window 段注释）。
  # 判据必须落在 SHET/TTLB 这些**次级码**上，落在学科码上会误杀整个市政专业。
  #
  # 实测（大歌剧院，`_find_parallel_pairs` 接闸前）：图框是一圈双线边框，
  # 间距恰在墙宽区间、重叠远超 1m，完美符合「墙」的几何判据 ——
  #   「底板换撑平面布置图」 `通用-图框C-SHET` 11 面 + `C-SHET-TTLB` 7 面假墙
  #   「8F节点大样图」       `A2|C—图框—标题块` 72 面假墙
  - group: sheet
    substrings: ["图框", "标题块", "会签栏", "图签"]
    patterns: ['(?:^|[-_])(?:SHET|TTLB|TBLK)(?:[-_]|$)']

  # 标注 / 文字 / 钢筋：中文用「标注/文字/标高/说明/编号/尺寸」，AIA 用
  # -TEXT/-DIMS/-NOTE/-IDEN/-ANNO 后缀——都是通用制图用语。
  # 「纵筋/箍筋/配筋/钢筋」画的是钢筋不是构件（一张墙配筋图造出 711 根假柱）。
  #
  # **这一组此前是 layer_conventions.py 里的硬编码正则**，挪进来后判据同源；
  # `is_annotation_layer()` 只问这一组（它答的是「标注依附于哪个构件」这个
  # 更窄的问题，与 sheet 组「画的是纸不是楼」不同，故分组保留、不并成一条）。
  - group: annotation
    substrings: ["标注", "文字", "说明", "编号", "尺寸标", "标高标", "注释", "图例",
                 "纵筋", "箍筋", "配筋", "钢筋", "拉筋", "分布筋"]
    # 前后都可以是边界：裸图层名 `TEXT` 也要命中（实测 TEXT 层造出 21 根假柱）；
    # 收尾用 (?:-|$) 保证 `TEXTURE` 不被误伤。
    patterns: ['(?:^|-)(?:TEXT|DIMS?|NOTE|IDEN|ANNO|TAG|LABEL|REBAR|REIN)(?:-|$)']
    # 「钢筋混凝土」是材料名（GB/T 50083），不是钢筋图层——
    # `钢筋混凝土墙` 是真真正正的墙，误杀的代价是构件凭空消失。
    exempt: ['钢筋(?:混凝土|砼)']

  # 装修饰面 / 图案：全库普查（4109 图 / 27905 个图层名 / 2.04 亿 path）实测的
  # **反向错**——它们被 wall 的通用子串「墙」判成结构墙：
  #   I—平面—墙面材料 16721 / I—平面—外墙装饰面层线 9855 / I—隔墙—地面阴影 10875
  # 合计约 3.8 万 path。饰面是贴在墙上的材料表达，不是墙体本身。
  # 与 sheet 组一样「不依附任何构件」，但画的是**面层**不是纸。
  - group: finish
    substrings: ["饰面", "装饰", "面层", "材料", "阴影", "图案", "铺装", "拼花",
                 "分格", "石材"]
    # AIA CAD Layer Guidelines 的次级码：FINH=finish、PATT=pattern。
    patterns: ['(?:^|-)(?:FINH|PATT)(?:-|$)']
    # **填充不是饰面**：填充截面就是构件本体（`I—隔墙—填充01(线状)` 50.2 万
    # path 判成 wall 是**对的**，与柱的 `S-COLS-HATCH` 同理——`_find_columns`
    # 明确依赖它）。装修 60 张实测：含填充的图层有 22.4 万图元（该批 18.6%），
    # 其中 `I—装饰—填充01(线状)` 一层 10.2 万图元含「装饰」正落在本组词表上，
    # 全靠这条豁免才没被清掉。清掉会造成大面积构件消失。
    exempt: ['填充', 'HATCH']
